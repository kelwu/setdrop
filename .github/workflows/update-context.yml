name: Update SetDrop Context

on:
  schedule:
    - cron: '47 23 * * *'   # 11:47pm UTC nightly — adjust if you want a specific timezone
  workflow_dispatch:          # Run manually from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Update setdrop-context.md
        run: |
          python3 << 'PYEOF'
          import subprocess, re
          from datetime import date

          commits = subprocess.run(
              ['git', 'log', '--oneline', '-20'],
              capture_output=True, text=True
          ).stdout.strip()

          with open('setdrop-context.md', 'r') as f:
              content = f.read()

          # Replace the code block inside "Recent Commits" section
          content = re.sub(
              r'(## Recent Commits[^\n]*\n\n```\n).*?(```)',
              rf'\g<1>{commits}\n\g<2>',
              content,
              flags=re.DOTALL
          )

          # Update the "Last updated" date
          today = date.today().strftime('%Y-%m-%d')
          content = re.sub(r'\*Last updated:.*?\*', f'*Last updated: {today}*', content)

          with open('setdrop-context.md', 'w') as f:
              f.write(content)

          print(f"Updated setdrop-context.md — {today}")
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add setdrop-context.md
          git diff --staged --quiet && echo "No changes." || \
            git commit -m "chore: nightly context update $(date '+%Y-%m-%d')" && git push
